<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<title>Courier Pro — доставка</title>
<style>
:root{--bg:#080b09;--panel:#111612;--panel2:#171d18;--line:#273028;--text:#f1f5f2;--muted:#9ba79e;--green:#45d483;--gold:#e6b84c;--red:#ff6b6b;--blue:#65a9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh}.container{max-width:1180px;margin:auto;padding:0 18px}.header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#0b0f0c;position:sticky;top:0;z-index:10}.logo{font-size:20px;font-weight:850}.logo span{color:var(--green)}.header-actions{display:flex;gap:8px;align-items:center}.btn{background:var(--green);color:#061008;padding:11px 16px;border-radius:10px;font-weight:750}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:#171000}.hero{padding:46px 0 28px;text-align:center}.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 12px}.hero p{color:var(--muted);font-size:17px;margin:0 auto 24px;max-width:650px}.section{padding:22px 0}.section h2{margin:0 0 14px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.place{min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.place-icon{font-size:42px}.place h3{margin:8px 0 4px;font-size:19px}.muted{color:var(--muted)}.tag{display:inline-block;background:#202820;color:var(--muted);padding:5px 8px;border-radius:999px;font-size:12px}.footer{border-top:1px solid var(--line);margin-top:35px;padding:25px 0;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:17px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.x{background:transparent;color:var(--muted);font-size:26px}.form{display:grid;gap:11px}.form label{font-weight:700}.form input,.form select,.form textarea{width:100%;background:#0c110e;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:9px;outline:none;margin-top:6px}.form textarea{min-height:75px}.menu{display:grid;gap:10px}.menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border:1px solid var(--line);padding:13px;border-radius:12px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:8px;background:var(--line);color:var(--text)}.cart{position:sticky;bottom:10px;margin-top:15px;background:#152219;border:1px solid #2d6b47;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.account{padding:24px 0}.account-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#202820;color:var(--gold);font-size:12px}.admin-nav{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.admin-nav button{white-space:nowrap;background:var(--panel2);color:var(--muted);padding:9px 12px;border-radius:9px;border:1px solid var(--line)}.admin-nav button.active{color:var(--green);border-color:#2d6b47}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}.notice{background:#151b16;border:1px solid var(--line);padding:12px;border-radius:11px;margin-bottom:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.order{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.order-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.header{height:62px}.hero{padding-top:32px}.container{padding:0 12px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="container" style="width:100%;display:flex;justify-content:space-between;align-items:center"><div class="logo">🚚 Courier <span>Pro</span></div><div class="header-actions" id="headerActions"><button class="btn secondary" onclick="openLogin()">Войти</button><button class="btn" onclick="openRegister()">Регистрация</button></div></div></header>
<main id="app"></main>
<footer class="footer"><div class="container">Courier Pro · доставка из любимых заведений</div></footer>
</div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle" style="margin:0"></h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const storage='courier-pro-mvp-v2';
let state=JSON.parse(localStorage.getItem(storage)||'null')||{user:null,cart:[],orders:[],adminTab:'Тарифы',tariffs:[{name:'По городу',city:'Лисаковск',zone:'Город',delivery:1200,courierType:'fixed',courierValue:800,serviceType:'fixed',serviceValue:400},{name:'За город',city:'Лисаковск',zone:'За город',delivery:2500,courierType:'percent',courierValue:65,serviceType:'percent',serviceValue:35}]};
const places=[{id:'evgo',name:'EVGO',icon:'🍕',desc:'Пицца, бургеры и напитки',items:[['Пицца Пепперони',3500],['Пицца 4 сыра',3800],['Бургер EVGO',2800],['Картофель фри',900],['Кола',600]]},{id:'sushi',name:'Sushi Mix',icon:'🍣',desc:'Суши и роллы',items:[['Филадельфия',4200],['Калифорния',3800],['Сет классический',6500]]},{id:'pizza',name:'Pizza City',icon:'🍕',desc:'Пицца и закуски',items:[['Маргарита',3000],['Пепперони',3500],['Наггетсы',2200]]}];
const couriers=[{name:'Алексей',online:true},{name:'Данияр',online:true},{name:'Руслан',online:false}];
function save(){localStorage.setItem(storage,JSON.stringify(state))}function money(n){return Number(n||0).toLocaleString('ru-RU')+' ₸'}function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function openLogin(){openModal('Вход',`<form class="form" onsubmit="login(event)"><label>Телефон<input name="phone" required placeholder="+7 700 000 00 00"></label><label>Пароль<input name="password" type="password" required></label><button class="btn">Войти</button><div class="muted">Демо: любой телефон и пароль.</div></form>`)}function openRegister(){openModal('Регистрация',`<form class="form" onsubmit="register(event)"><label>Имя<input name="name" required></label><label>Телефон<input name="phone" required></label><label>Пароль<input name="password" type="password" required></label><label>Кто вы<select name="role"><option>Клиент</option><option>Курьер</option><option>Заведение</option></select></label><button class="btn">Создать аккаунт</button></form>`)}function login(e){e.preventDefault();state.user={name:'Клиент',role:'Клиент',phone:e.target.phone.value};save();closeModal();render()}function register(e){e.preventDefault();state.user={name:e.target.name.value,role:e.target.role.value,phone:e.target.phone.value};save();closeModal();render()}function logout(){state.user=null;save();render()}
function home(){return `<div class="container"><section class="hero"><h1>Доставка из любимых заведений</h1><p>Выбирайте заведение, собирайте заказ и оформляйте доставку. Всё в одном месте.</p><button class="btn" onclick="document.getElementById('places').scrollIntoView({behavior:'smooth'})">Выбрать заведение</button></section><section class="section" id="places"><h2>🏪 С нами сотрудничают</h2><div class="grid">${places.map(p=>`<div class="card place"><div><div class="place-icon">${p.icon}</div><h3>${p.name}</h3><div class="muted">${p.desc}</div></div><button class="btn" onclick="openPlace('${p.id}')">Заказать</button></div>`).join('')}</div></section><section class="section"><div class="card"><h2>🚚 Как это работает</h2><div class="grid"><div><b>1. Выбираете заведение</b><p class="muted">Открываете меню и добавляете товары.</p></div><div><b>2. Оформляете доставку</b><p class="muted">Указываете адрес и способ оплаты.</p></div><div><b>3. Курьер доставляет</b><p class="muted">Курьер принимает заказ и меняет статусы.</p></div></div></div></section></div>`}
function openPlace(id){const p=places.find(x=>x.id===id);state.cart=[];openModal(p.name,`<div class="notice">${p.desc}</div><div class="menu">${p.items.map((it,i)=>`<div class="menu-item"><div><b>${it[0]}</b><div class="muted">${money(it[1])}</div></div><div class="qty"><button onclick="changeCart(${i},-1,'${id}')">−</button><span id="q-${id}-${i}">0</span><button onclick="changeCart(${i},1,'${id}')">+</button></div></div>`).join('')}</div><div class="cart"><b>Корзина: <span id="cartTotal">0 ₸</span></b><button class="btn" onclick="checkout('${id}')">Оформить</button></div>`)}
function changeCart(i,d,id){const p=places.find(x=>x.id===id),item=p.items[i];let x=state.cart.find(x=>x.place===id&&x.i===i);if(!x&&d>0){x={place:id,i,qty:0};state.cart.push(x)}if(x){x.qty=Math.max(0,x.qty+d);if(!x.qty)state.cart=state.cart.filter(y=>y!==x)}document.querySelectorAll('[id^="q-"]').forEach(el=>{const z=el.id.split('-');const c=state.cart.find(x=>x.place===z[1]&&x.i==z[2]);el.textContent=c?c.qty:0});document.getElementById('cartTotal').textContent=money(state.cart.filter(x=>x.place===id).reduce((s,x)=>s+p.items[x.i][1]*x.qty,0))}
function checkout(id){const selected=state.cart.filter(x=>x.place===id);if(!selected.length)return alert('Добавьте товары в корзину');if(!state.user)return openLogin();const p=places.find(x=>x.id===id),amount=selected.reduce((s,x)=>s+p.items[x.i][1]*x.qty,0);openModal('Оформление заказа',`<form class="form" onsubmit="createOrder(event,'${id}',${amount})"><div class="notice">${p.name}<br>Сумма товаров: <b>${money(amount)}</b></div><label>Адрес доставки<input name="address" required placeholder="Улица, дом, подъезд, квартира"></label><label>Телефон<input name="phone" value="${state.user.phone||''}" required></label><label>Тариф доставки<select name="tariff">${state.tariffs.map((t,i)=>`<option value="${i}">${t.name} — ${money(t.delivery)}</option>`).join('')}</select></label><label>Оплата<select name="payment"><option>Kaspi</option><option>Наличные</option></select></label><label>Комментарий<textarea name="comment" placeholder="Подъезд, этаж, домофон..."></textarea></label><button class="btn">Подтвердить заказ</button></form>`)}
function createOrder(e,id,amount){e.preventDefault();const f=e.target,p=places.find(x=>x.id===id),tar=state.tariffs[Number(f.tariff.value)],o={id:1000+state.orders.length+1,client:state.user.name,phone:f.phone.value,address:f.address.value,restaurant:p.name,amount,payment:f.payment.value,tariff:tar.name,delivery:tar.delivery,status:'Новый',courier:'Не назначен',time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),comment:f.comment.value,createdBy:'client'};state.orders.unshift(o);state.cart=[];save();closeModal();alert('Заказ №'+o.id+' создан!');render()}
function customer(){return `<div class="container account"><div class="account-head"><div><h1>Личный кабинет</h1><div class="muted">${state.user.name} · ${state.user.role}</div></div><button class="btn secondary" onclick="logout()">Выйти</button></div><div class="card"><h2>📦 Мои заказы</h2>${state.orders.filter(o=>o.client===state.user.name).length?state.orders.filter(o=>o.client===state.user.name).map(o=>`<div class="order"><b>Заказ №${o.id}</b> <span class="status">${o.status}</span><p class="muted">${o.restaurant} · ${money(o.amount)} + доставка ${money(o.delivery)}<br>📍 ${o.address}<br>🚗 Курьер: ${o.courier}</p></div>`).join(''):'<p class="muted">Заказов пока нет.</p>'}</div></div>`}
function staff(){return `<div class="container account"><div class="account-head"><div><h1>${state.user.role}</h1><div class="muted">Личный кабинет</div></div><button class="btn secondary" onclick="logout()">Выйти</button></div>${state.user.role==='Курьер'?courierCab():state.user.role==='Заведение'?restaurantCab():dispatcherCab()}</div>`}
function courierCab(){return `<div class="notice">Статус: <b>🟢 На линии</b></div><h2>Доступные заказы</h2>${state.orders.filter(o=>o.status==='Новый').map(o=>`<div class="order"><b>№${o.id} · ${o.restaurant}</b><p class="muted">📍 ${o.address}<br>💰 Доставка: ${money(o.delivery)} · ${o.payment}</p><button class="btn" onclick="acceptOrder(${o.id})">Принять заказ</button></div>`).join('')||'<div class="card muted">Свободных заказов нет.</div>'}<h2 style="margin-top:24px">Мои заказы</h2>${state.orders.filter(o=>o.courier===state.user.name).map(o=>`<div class="order"><b>№${o.id}</b> · ${o.restaurant} <span class="status">${o.status}</span><p class="muted">${o.address}</p><button class="btn secondary" onclick="advance(${o.id})">Следующий статус</button></div>`).join('')}</div>`}
function acceptOrder(id){const o=state.orders.find(x=>x.id===id);o.courier=state.user.name;o.status='Принят';save();render()}function advance(id){const o=state.orders.find(x=>x.id===id),seq=['Принят','Готов','Забран','В пути','Доставлен'],i=seq.indexOf(o.status);if(i>=0&&i<seq.length-1)o.status=seq[i+1];save();render()}
function restaurantCab(){return `<div class="card"><h2>🍴 Мои заказы</h2>${state.orders.filter(o=>o.restaurant==='EVGO').map(o=>`<div class="order"><b>№${o.id}</b> · ${o.client} <span class="status">${o.status}</span><p class="muted">${money(o.amount)} · доставка ${money(o.delivery)}<br>${o.address}</p><button class="btn secondary" onclick="advance(${o.id})">Изменить статус</button></div>`).join('')||'<p class="muted">Новых заказов нет.</p>'}</div>`}
function dispatcherCab(){return `<div class="card"><div class="account-head"><h2>📦 Заказы</h2><button class="btn" onclick="manualOrder()">＋ Добавить заказ</button></div>${state.orders.map(o=>`<div class="order"><b>№${o.id}</b> · ${o.client} · ${o.restaurant} <span class="status">${o.status}</span><p class="muted">📍 ${o.address}<br>Доставка: ${money(o.delivery)} · Курьер: ${o.courier}</p><div class="order-actions"><button class="btn secondary" onclick="assign(${o.id})">Назначить курьера</button><button class="btn secondary" onclick="advance(${o.id})">Следующий статус</button></div></div>`).join('')}</div>`}
function manualOrder(){openModal('Добавить заказ',`<form class="form" onsubmit="manualCreate(event)"><label>Клиент<input name="client" required></label><label>Телефон<input name="phone"></label><label>Адрес<input name="address" required></label><label>Заведение<select name="restaurant">${places.map(p=>`<option>${p.name}</option>`).join('')}</select></label><label>Сумма заказа<input name="amount" type="number" value="3500"></label><label>Тариф<select name="tariff">${state.tariffs.map((t,i)=>`<option value="${i}">${t.name} — ${money(t.delivery)}</option>`).join('')}</select></label><label>Оплата<select name="payment"><option>Kaspi</option><option>Наличные</option></select></label><button class="btn">Создать и отправить курьерам</button></form>`)}
function manualCreate(e){e.preventDefault();const f=e.target,t=state.tariffs[+f.tariff.value];state.orders.unshift({id:1000+state.orders.length+1,client:f.client.value,phone:f.phone.value,address:f.address.value,restaurant:f.restaurant.value,amount:+f.amount.value,payment:f.payment.value,tariff:t.name,delivery:t.delivery,status:'Новый',courier:'Не назначен',time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),comment:'',createdBy:'dispatcher'});save();closeModal();render()}
function assign(id){openModal('Назначить курьера',`<div class="menu">${couriers.map(c=>`<button class="btn ${c.online?'':'secondary'}" ${c.online?'':'disabled'} onclick="doAssign(${id},'${c.name}')">${c.online?'🟢':'⚪'} ${c.name}</button>`).join('')}</div>`)}function doAssign(id,name){const o=state.orders.find(x=>x.id===id);o.courier=name;o.status='Принят';save();closeModal();render()}
function admin(){return `<div class="container account"><div class="account-head"><div><h1>Администратор</h1><div class="muted">Полное управление системой</div></div><button class="btn secondary" onclick="logout()">Выйти</button></div><div class="admin-nav">${['Тарифы','Заведения','Пользователи','Заказы'].map(x=>`<button class="${state.adminTab===x?'active':''}" onclick="state.adminTab='${x}';save();render()">${x}</button>`).join('')}</div>${adminContent()}</div>`}
function adminContent(){if(state.adminTab==='Тарифы')return `<div class="notice">Стоимость доставки берётся с клиента/заведения. Затем она распределяется между курьером и службой по выбранному тарифу.</div><div class="grid">${state.tariffs.map((t,i)=>`<div class="card"><h3>${t.name}</h3><p class="muted">${t.city} · ${t.zone}</p><b>Доставка клиенту: ${money(t.delivery)}</b><p>Курьер: <b>${t.courierType==='fixed'?money(t.courierValue):t.courierValue+'%'}</b><br>Служба: <b>${t.serviceType==='fixed'?money(t.serviceValue):t.serviceValue+'%'}</b></p><button class="btn secondary" onclick="editTariff(${i})">Изменить</button></div>`).join('')}<div class="card"><h3>＋ Новый тариф</h3><button class="btn" onclick="newTariff()">Создать</button></div></div>`;if(state.adminTab==='Заведения')return `<div class="grid">${places.map(p=>`<div class="card"><div class="place-icon">${p.icon}</div><h3>${p.name}</h3><p class="muted">${p.desc}</p><button class="btn secondary" onclick="alert('Настройки заведения будут расширены')">Управление</button></div>`).join('')}</div>`;if(state.adminTab==='Пользователи')return `<div class="card"><h2>Пользователи</h2><table class="table"><tr><th>Имя</th><th>Роль</th><th>Телефон</th></tr><tr><td>Алексей</td><td>Курьер</td><td>+7 ***</td></tr><tr><td>EVGO</td><td>Заведение</td><td>+7 ***</td></tr><tr><td>Диспетчер</td><td>Диспетчер</td><td>+7 ***</td></tr></table></div>`;return `<div class="card"><h2>Заказы</h2><p class="muted">Всего: ${state.orders.length}. Финансовые значения сохраняются в каждом заказе.</p></div>`}
function editTariff(i){const t=state.tariffs[i];openModal('Изменить тариф',`<form class="form" onsubmit="saveTariff(event,${i})"><label>Название<input name="name" value="${t.name}"></label><label>Город<input name="city" value="${t.city}"></label><label>Зона<input name="zone" value="${t.zone}"></label><label>Стоимость доставки<input name="delivery" type="number" value="${t.delivery}"></label><div class="split"><label>Курьер — тип<select name="ct"><option value="fixed" ${t.courierType==='fixed'?'selected':''}>Фиксированная сумма</option><option value="percent" ${t.courierType==='percent'?'selected':''}>Процент</option></select></label><label>Значение<input name="cv" type="number" value="${t.courierValue}"></label></div><div class="split"><label>Служба — тип<select name="st"><option value="fixed" ${t.serviceType==='fixed'?'selected':''}>Фиксированная сумма</option><option value="percent" ${t.serviceType==='percent'?'selected':''}>Процент</option></select></label><label>Значение<input name="sv" type="number" value="${t.serviceValue}"></label></div><button class="btn">Сохранить</button></form>`)}function saveTariff(e,i){e.preventDefault();const f=e.target,t=state.tariffs[i];Object.assign(t,{name:f.name.value,city:f.city.value,zone:f.zone.value,delivery:+f.delivery.value,courierType:f.ct.value,courierValue:+f.cv.value,serviceType:f.st.value,serviceValue:+f.sv.value});save();closeModal();render()}function newTariff(){state.tariffs.push({name:'Новый тариф',city:'Лисаковск',zone:'Новая зона',delivery:1000,courierType:'fixed',courierValue:700,serviceType:'fixed',serviceValue:300});state.adminTab='Тарифы';save();render()}
function render(){const a=document.getElementById('app');document.getElementById('headerActions').innerHTML=state.user?`<span class="muted">${state.user.name} · ${state.user.role}</span>`:'';if(!state.user)a.innerHTML=home();else if(state.user.role==='Клиент')a.innerHTML=customer();else if(state.user.role==='Администратор')a.innerHTML=admin();else a.innerHTML=staff()}render();
</script>
</body>
</html>
