<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<title>Courier Pro — управление доставкой</title>
<style>
:root{--bg:#080b09;--panel:#111612;--panel2:#171d18;--line:#273028;--text:#f1f5f2;--muted:#9ba79e;--green:#45d483;--gold:#e6b84c;--red:#ff6b6b;--blue:#65a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid var(--line);padding:22px 14px;background:#0b0f0c;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;padding:8px 12px 24px}.logo span{color:var(--green)}.nav button{width:100%;background:transparent;color:var(--muted);padding:13px 12px;text-align:left;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{padding:20px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{font-size:25px;margin:0}.muted{color:var(--muted)}.btn{background:var(--green);color:#061008;padding:11px 16px;border-radius:10px;font-weight:750}.btn.gold{background:var(--gold)}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:28px;font-weight:800;margin-top:5px}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:18px;margin:0}.orders{display:grid;gap:10px}.order{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px}.order-main{min-width:0}.order-title{display:flex;align-items:center;gap:8px;font-weight:800}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#202820;color:var(--muted)}.badge.new{color:var(--gold)}.badge.progress{color:var(--blue)}.badge.done{color:var(--green)}.badge.cancel{color:var(--red)}.order-info{color:var(--muted);margin-top:7px;line-height:1.5}.order-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.order-actions button{padding:9px 11px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}.form{display:grid;gap:10px}.form label{font-weight:700}.form input,.form select,.form textarea{width:100%;background:#0c110e;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:9px;outline:none}.form textarea{min-height:75px;resize:vertical}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(520px,100%);padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.x{background:transparent;color:var(--muted);font-size:25px}.rolebar{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.rolebar button{white-space:nowrap;background:var(--panel2);color:var(--muted);padding:8px 12px;border-radius:9px;border:1px solid var(--line)}.rolebar button.active{color:var(--green);border-color:#2d6b47}.empty{text-align:center;padding:35px;color:var(--muted)}.hidden{display:none!important}.mobile-nav{display:none}@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:14px 12px 78px}.cards{grid-template-columns:repeat(2,1fr)}.order{grid-template-columns:1fr}.order-actions{justify-content:flex-start}.order-actions button{flex:1}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b0f0c;border-top:1px solid var(--line);z-index:4}.mobile-nav button{flex:1;background:transparent;color:var(--muted);padding:11px 4px;font-size:12px}.mobile-nav button.active{color:var(--green)}}@media(max-width:430px){.cards{gap:8px}.card{padding:13px}.metric{font-size:23px}.top h1{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">🚚 Courier <span>Pro</span></div><div class="nav" id="nav"></div></aside>
<main class="main">
<div class="top"><div><h1 id="pageTitle">Заказы</h1><div class="muted">Система управления доставкой</div></div><button class="btn" id="newBtn">＋ Новый заказ</button></div>
<div class="rolebar" id="roles"></div>
<div id="content"></div>
</main></div>
<div class="mobile-nav" id="mobileNav"></div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2 style="margin:0">Новый заказ</h2><button class="x" id="close">×</button></div><form class="form" id="orderForm"><label>Клиент<input name="client" required placeholder="Имя клиента"></label><label>Телефон<input name="phone" placeholder="+7 ..."></label><label>Адрес<input name="address" required placeholder="Улица, дом, подъезд, квартира"></label><label>Заведение<input name="restaurant" value="Burger House" required></label><label>Сумма заказа, ₸<input name="amount" type="number" min="0" value="3500" required></label><label>Оплата<select name="payment"><option>Kaspi</option><option>Наличные</option></select></label><label>Комментарий<textarea name="comment" placeholder="Подъезд, этаж, домофон..."></textarea></label><button class="btn" type="submit">Создать заказ</button></form></div></div>
<script>
const key='courier-pro-orders-v1';
let orders=JSON.parse(localStorage.getItem(key)||'null')||[
{id:1001,client:'Айгерим',phone:'+7 707 555-21-21',address:'Абая 25, подъезд 2, кв. 48',restaurant:'Burger House',amount:3500,payment:'Kaspi',status:'В пути',courier:'Алексей',time:'04:05',comment:'Позвонить у подъезда'},
{id:1002,client:'Сергей',phone:'+7 700 111-22-33',address:'5-15, подъезд 3, кв. 27',restaurant:'Sushi Mix',amount:5200,payment:'Наличные',status:'Новый',courier:'—',time:'04:12',comment:'Домофон 27'},
{id:1003,client:'Марина',phone:'+7 775 333-44-55',address:'Абая 41, кв. 12',restaurant:'Pizza City',amount:4100,payment:'Kaspi',status:'Готов',courier:'Данияр',time:'03:54',comment:''},
];
const couriers=[{name:'Алексей',status:'На доставке',orders:7,earned:12600},{name:'Данияр',status:'Свободен',orders:5,earned:9000},{name:'Руслан',status:'На доставке',orders:9,earned:16200}];
let page='orders',role='Диспетчер';
const navItems=[['orders','📦 Заказы'],['couriers','🚴 Курьеры'],['restaurants','🍔 Заведения'],['stats','📊 Статистика'],['settings','⚙️ Настройки']];
const roles=['Клиент','Заведение','Курьер','Диспетчер','Администратор'];
function save(){localStorage.setItem(key,JSON.stringify(orders))}
function statusClass(s){if(s==='Новый')return'new';if(s==='Доставлен')return'done';if(s==='Отменён')return'cancel';return'progress'}
function nextStatus(o){const seq=['Новый','Принят','Готов','Забран','В пути','Доставлен'];const i=seq.indexOf(o.status);if(i>=0&&i<seq.length-1)o.status=seq[i+1];save();render()}
function orderCard(o){return `<div class="order"><div class="order-main"><div class="order-title">#${o.id} · ${o.client} <span class="badge ${statusClass(o.status)}">${o.status}</span></div><div class="order-info">📍 ${o.address}<br>🍴 ${o.restaurant} · 💰 ${o.amount.toLocaleString('ru-RU')} ₸ · ${o.payment}<br>🚴 ${o.courier} · ${o.time}${o.comment?' · '+o.comment:''}</div></div><div class="order-actions">${o.status!=='Доставлен'&&o.status!=='Отменён'?`<button onclick="advance(${o.id})">Следующий статус →</button>`:''}<button onclick="cancelOrder(${o.id})">✕</button></div></div>`}
window.advance=id=>{const o=orders.find(x=>x.id===id);if(o){if(o.status==='Новый')o.courier=o.courier==='—'?'Алексей':o.courier;nextStatus(o)}};
window.cancelOrder=id=>{const o=orders.find(x=>x.id===id);if(o){o.status='Отменён';save();render()}};
function dashboard(){let active=orders.filter(o=>!['Доставлен','Отменён'].includes(o.status)).length;let revenue=orders.filter(o=>o.status==='Доставлен').reduce((a,o)=>a+o.amount,0);return `<div class="cards"><div class="card"><div class="muted">Всего заказов</div><div class="metric">${orders.length}</div></div><div class="card"><div class="muted">Активные</div><div class="metric gold">${active}</div></div><div class="card"><div class="muted">Доставлено</div><div class="metric green">${orders.filter(o=>o.status==='Доставлен').length}</div></div><div class="card"><div class="muted">Оборот</div><div class="metric">${revenue.toLocaleString('ru-RU')} ₸</div></div></div>`}
function ordersPage(){return `${dashboard()}<div class="section"><div class="section-head"><h2>Последние заказы</h2><span class="muted">${role}</span></div><div class="orders">${orders.length?orders.map(orderCard).join(''):'<div class="empty">Заказов пока нет</div>'}</div></div>`}
function couriersPage(){return `<div class="cards">${couriers.map(c=>`<div class="card"><div style="font-size:18px;font-weight:800">🚴 ${c.name}</div><div class="muted" style="margin:7px 0">${c.status}</div><div>Заказов: <b>${c.orders}</b></div><div class="green">Заработано: ${c.earned.toLocaleString('ru-RU')} ₸</div></div>`).join('')}</div><div class="section card"><div class="section-head"><h2>Распределение заказов</h2><button class="btn" onclick="alert('Автораспределение включено в следующей версии')">Автораспределить</button></div><p class="muted">В MVP новые заказы можно назначать кнопкой «Следующий статус». Следующим этапом добавим ручное назначение курьера.</p></div>`}
function restaurantsPage(){return `<div class="cards"><div class="card"><b>🍔 Burger House</b><p class="muted">12 заказов сегодня</p><span class="badge done">Работает</span></div><div class="card"><b>🍣 Sushi Mix</b><p class="muted">8 заказов сегодня</p><span class="badge done">Работает</span></div><div class="card"><b>🍕 Pizza City</b><p class="muted">6 заказов сегодня</p><span class="badge done">Работает</span></div></div>`}
function statsPage(){let delivered=orders.filter(o=>o.status==='Доставлен').length;let total=orders.length;let avg=total?Math.round(orders.reduce((a,o)=>a+o.amount,0)/total):0;return `<div class="cards"><div class="card"><div class="muted">Всего заказов</div><div class="metric">${total}</div></div><div class="card"><div class="muted">Выполнено</div><div class="metric green">${delivered}</div></div><div class="card"><div class="muted">Средний чек</div><div class="metric">${avg.toLocaleString('ru-RU')} ₸</div></div><div class="card"><div class="muted">Комиссия 15%</div><div class="metric gold">${Math.round(orders.reduce((a,o)=>a+o.amount,0)*.15).toLocaleString('ru-RU')} ₸</div></div></div><div class="section card"><h2>Статусы</h2><table class="table"><tr><th>Статус</th><th>Заказов</th></tr>${['Новый','Принят','Готов','Забран','В пути','Доставлен','Отменён'].map(s=>`<tr><td>${s}</td><td>${orders.filter(o=>o.status===s).length}</td></tr>`).join('')}</table></div>`}
function settingsPage(){return `<div class="card"><h2>Настройки MVP</h2><p class="muted">Данные заказов сейчас сохраняются в памяти браузера (localStorage). Следующий этап — подключение Firebase, авторизация и общая база для всех телефонов.</p><button class="btn secondary" onclick="if(confirm('Удалить локальные тестовые заказы?')){localStorage.removeItem(key);location.reload()}">Сбросить тестовые данные</button></div>`}
function render(){document.getElementById('pageTitle').textContent=navItems.find(x=>x[0]===page)?.[1].replace(/^\S+ /,'')||page;document.getElementById('nav').innerHTML=navItems.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');document.getElementById('mobileNav').innerHTML=navItems.slice(0,4).map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');document.getElementById('roles').innerHTML=roles.map(r=>`<button class="${role===r?'active':''}" onclick="setRole('${r}')">${r}</button>`).join('');let html=page==='orders'?ordersPage():page==='couriers'?couriersPage():page==='restaurants'?restaurantsPage():page==='stats'?statsPage():settingsPage();document.getElementById('content').innerHTML=html}
window.go=p=>{page=p;render()};window.setRole=r=>{role=r;render()};
document.getElementById('newBtn').onclick=()=>document.getElementById('modal').classList.add('show');document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const id=Math.max(1000,...orders.map(o=>o.id))+1;orders.unshift({id,client:f.get('client'),phone:f.get('phone'),address:f.get('address'),restaurant:f.get('restaurant'),amount:Number(f.get('amount')),payment:f.get('payment'),status:'Новый',courier:'—',time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),comment:f.get('comment')});save();e.target.reset();document.getElementById('modal').classList.remove('show');render()};
render();
</script>
</body></html>
